# Wharfedale local network: 4 validators, a full node (rpc0) and the web app.
# Use the Makefile in the repository root: make run | stop | clear | logs | example | e2e | test.
#
# RPC: node0..node3 on host ports 18443..18446, rpc0 (full node) on 18447. Web app: :8080.
# Images are built from source: the build context is the folder holding wharfedale/,
# malachite/ (the fork), wharfedale-sdk-rs/ and, for the web app, wharfedale-web/,
# wharfedale-sdk-ts/ and damp/ (its regulated-asset signer is compiled into the web image).

name: wharfedale

services:
  # Genesis, keys and configs for every node, generated once into the `net` volume.
  init:
    image: wharfedale:dev
    build:
      context: ../..
      dockerfile: wharfedale/docker/Dockerfile
    volumes:
      - net:/net
    command:
      - sh
      - -c
      - "[ -f /net/faucet.json ] || wharfedale testnet --home /net --hosts node0,node1,node2,node3 --full-hosts rpc0 --chain-id wharfedale-docker"

  node0:
    image: wharfedale:dev
    command: [wharfedale, start, --home, /net/node-0]
    volumes:
      - net:/net
    ports: ["18443:18443"]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }

  node1:
    image: wharfedale:dev
    command: [wharfedale, start, --home, /net/node-1]
    volumes:
      - net:/net
    ports: ["18444:18443"]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }

  node2:
    image: wharfedale:dev
    command: [wharfedale, start, --home, /net/node-2]
    volumes:
      - net:/net
    ports: ["18445:18443"]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }

  node3:
    image: wharfedale:dev
    command: [wharfedale, start, --home, /net/node-3]
    volumes:
      - net:/net
    ports: ["18446:18443"]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }

  # Full node: follows the chain, serves RPC, relays transactions; never votes.
  rpc0:
    image: wharfedale:dev
    command: [wharfedale, start, --home, /net/full-0]
    volumes:
      - net:/net
    ports: ["18447:18443"]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }

  # Web app: explorer, network, wallet, faucet, assets, docs. Reads and submits through rpc0,
  # polls every node for the network page, pays the faucet from /net/faucet.json.
  web:
    image: wharfedale-web:dev
    build:
      context: ../..
      dockerfile: wharfedale-web/Dockerfile
    volumes:
      - net:/net:ro
      - ./web-config.json:/config/config.json:ro
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on:
      rpc0: { condition: service_started }

volumes:
  net: {}
