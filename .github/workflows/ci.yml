# Tests the node; on master and on version tags publishes its Docker image to
# ghcr.io/wharfedalebtc/wharfedale (linux/amd64 + linux/arm64) and its Linux binaries.
#
#   push to master   → image tags `latest` and `sha-<short>`; binaries as workflow artifacts
#   push tag vX.Y.Z  → image tags `X.Y.Z`, `X.Y` and `sha-<short>`; a GitHub Release with binaries
#   pull request     → tests only
#
# The workspace builds against sibling checkouts, laid out as locally:
#   malachite/          WharfedaleBTC/malachite at MALACHITE_REF (the fork)
#   wharfedale-sdk-rs/  WharfedaleBTC/wharfedale-sdk-rs at SDK_RS_REF
# Both are public: no token needed.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MALACHITE_REF: wharfedale/mempool-channel
  SDK_RS_REF: master
  IMAGE: ghcr.io/wharfedalebtc/wharfedale

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: wharfedale, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: WharfedaleBTC/malachite, ref: "${{ env.MALACHITE_REF }}", path: malachite, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: WharfedaleBTC/wharfedale-sdk-rs, ref: "${{ env.SDK_RS_REF }}", path: wharfedale-sdk-rs, persist-credentials: false }

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wharfedale/target
          key: cargo-${{ runner.os }}-${{ hashFiles('wharfedale/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Clippy
        working-directory: wharfedale
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        working-directory: wharfedale
        run: cargo test --workspace --locked

  # One native build per architecture, pushed by digest; `publish` joins them under the tags.
  image:
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: wharfedale, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: WharfedaleBTC/malachite, ref: "${{ env.MALACHITE_REF }}", path: malachite, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: WharfedaleBTC/wharfedale-sdk-rs, ref: "${{ env.SDK_RS_REF }}", path: wharfedale-sdk-rs, persist-credentials: false }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: wharfedale/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=node-${{ matrix.arch }}
          cache-to: type=gha,scope=node-${{ matrix.arch }},mode=max

      - name: Export the binaries (same build, from the cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: wharfedale/docker/Dockerfile
          target: binaries
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=${{ runner.temp }}/bin
          cache-from: type=gha,scope=node-${{ matrix.arch }}

      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/digests" "$RUNNER_TEMP/pkg"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
          tar -czf "$RUNNER_TEMP/pkg/wharfedale-linux-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP/bin" wharfedale wharfedale-wallet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wharfedale-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/pkg/*.tar.gz
          retention-days: 30

  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect '${{ env.IMAGE }}:${{ steps.meta.outputs.version }}'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: wharfedale-linux-*
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\` (linux/amd64, linux/arm64)."
